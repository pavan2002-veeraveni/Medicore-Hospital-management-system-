# =============================================================================
# MediCore Monitoring - Prometheus Scrape Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'medicore-api'
    metrics_path: '/health'
    static_configs:
      - targets: ['api:4000']

  - job_name: 'medicore-analytics'
    metrics_path: '/health'
    static_configs:
      - targets: ['analytics:8000']
