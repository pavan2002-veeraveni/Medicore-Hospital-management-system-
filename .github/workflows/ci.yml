# =============================================================================
# MediCore - GitHub Actions CI/CD Pipeline
# =============================================================================

name: MediCore CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # =========================================================================
  # Backend Tests & Checks
  # =========================================================================
  backend:
    name: Backend - Lint, Type Check, Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicore_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: medicore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicore_test -d medicore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend/api
        run: npx prisma generate

      - name: Type check
        working-directory: backend/api
        run: npm run typecheck

      - name: Lint
        working-directory: backend/api
        run: npm run lint

      - name: Run database migrations
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql://medicore_test:test_password@localhost:5432/medicore_test
        run: npx prisma migrate deploy

      - name: Seed test database
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql://medicore_test:test_password@localhost:5432/medicore_test
        run: npm run db:seed

      - name: Run tests
        working-directory: backend/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://medicore_test:test_password@localhost:5432/medicore_test
          TEST_DATABASE_URL: postgresql://medicore_test:test_password@localhost:5432/medicore_test
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
          REDIS_URL: redis://localhost:6379
        run: npm run test -- --reporter=verbose

  # =========================================================================
  # Frontend Tests & Checks
  # =========================================================================
  frontend:
    name: Frontend - Lint, Type Check, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --reporter=verbose

  # =========================================================================
  # Python Analytics Tests
  # =========================================================================
  analytics:
    name: Analytics - Lint, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/analytics/requirements*.txt

      - name: Install dependencies
        working-directory: backend/analytics
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend/analytics
        run: ruff check .

      - name: Type check with mypy
        working-directory: backend/analytics
        run: mypy app/ --ignore-missing-imports || true

      - name: Run tests
        working-directory: backend/analytics
        env:
          ANALYTICS_API_KEY: change-this-to-a-secure-api-key
        run: python -m pytest tests/ -v --tb=short

  # =========================================================================
  # Security Scanning
  # =========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit workspace dependencies
        run: npm audit --audit-level=high || true

      - name: Check for secrets
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -rn "password\s*=" --include="*.ts" --include="*.tsx" --include="*.py" . \
            | grep -v "node_modules" \
            | grep -v ".env.example" \
            | grep -v "password:" \
            | grep -v "passwordHash" \
            | grep -v "password_hash" \
            | grep -v "schema" \
            | grep -v "test" \
            | grep -v "mock" || true

  # =========================================================================
  # Docker Build
  # =========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, analytics]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t medicore-api:test .

      - name: Build Web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t medicore-web:test ./frontend

      - name: Build Analytics image
        run: docker build -f infrastructure/docker/Dockerfile.analytics -t medicore-analytics:test ./backend/analytics

  # =========================================================================
  # Database Migration Check
  # =========================================================================
  migration-check:
    name: Database Migration Validation
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicore_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: medicore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicore_test -d medicore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql://medicore_test:test_password@localhost:5432/medicore_test
        run: npx prisma migrate deploy

      - name: Validate schema
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql://medicore_test:test_password@localhost:5432/medicore_test
        run: npx prisma validate

  # =========================================================================
  # Staging Deployment (requires approval for production)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [backend, frontend, analytics, docker, migration-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: ${{ vars.STAGING_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo "Staging deployment would be configured here"

  deploy-production:
    name: Deploy to Production
    needs: [backend, frontend, analytics, docker, migration-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ vars.PRODUCTION_ENVIRONMENT || 'production' }}
      # Requires manual approval in GitHub Settings -> Environments -> production

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Production deployment requires manual approval and would be configured here"
